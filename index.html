<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interactive Video Learning — Restaurant English</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--text:#f7f8fb;--muted:#aab3c5;--accent:#7c5cff;--accent2:#9a86ff;--good:#37c98b;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#080c17,#121a2d);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(1100px,94vw);margin:0 auto;padding:24px 0 40px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);font-weight:700}.title{font-size:clamp(24px,4vw,38px);font-weight:800;margin:6px 0}.sub{color:var(--muted);margin:0}.badge{border:1px solid var(--border);background:rgba(255,255,255,.05);padding:8px 11px;border-radius:999px;color:var(--muted);font-size:13px;white-space:nowrap}.player{position:relative;background:#000;border-radius:18px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.35)}video{display:block;width:100%;height:auto;max-height:72vh;background:#000}video::-webkit-media-controls{display:flex!important}.start{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.55));z-index:3}.start.hidden{display:none}.start button,.primary{border:0;background:var(--accent);color:white;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:750;cursor:pointer;box-shadow:0 10px 30px rgba(124,92,255,.3)}.start small{display:block;margin-top:10px;text-align:center;color:#ddd}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.62);z-index:4}.overlay[hidden]{display:none!important}.question{width:min(650px,94%);background:rgba(18,26,45,.98);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.55)}.qtag{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent2);font-weight:800}.question h2{font-size:clamp(19px,3vw,26px);line-height:1.25;margin:8px 0 17px}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--border);background:#182239;color:#fff;border-radius:13px;padding:13px;text-align:left;cursor:pointer;font-size:15px;line-height:1.35}.option.selected{border-color:var(--accent2);background:rgba(124,92,255,.18)}.option input{accent-color:var(--accent);margin-top:3px}.record{width:100%;margin-top:15px}.record:disabled{opacity:.45;cursor:not-allowed}.timeline{padding:14px 2px 0}.track{height:7px;background:#273148;border-radius:99px;position:relative;overflow:visible}.progress{height:100%;width:0;background:var(--accent);border-radius:99px}.dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:#66718a;border:2px solid #0b1020}.dot.done{background:var(--good)}.dot.active{background:var(--accent2);box-shadow:0 0 0 5px rgba(154,134,255,.16)}.time{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:9px}.status{min-height:25px;color:var(--muted);font-size:14px;margin-top:12px}.panel{margin-top:18px;background:rgba(18,26,45,.82);border:1px solid var(--border);border-radius:18px;padding:18px}.panel h3{margin:0 0 8px}.panel p{color:var(--muted);line-height:1.55}.results{display:none}.results.show{display:block}.score{font-size:42px;font-weight:850;margin:5px 0}.review{display:grid;gap:10px;margin-top:14px}.review-item{border:1px solid var(--border);border-radius:12px;padding:12px}.review-item strong{display:block;margin-bottom:4px}.correct{color:var(--good)}.wrong{color:#ff8e8e}.restart{margin-top:16px;background:transparent;border:1px solid var(--border);color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}@media(max-width:640px){
.wrap{width:100%;padding:14px 0 28px}
.top{padding:0 14px;display:block}
.badge{display:inline-block;margin-top:10px}
.player{border-radius:0}
.overlay{position:fixed;inset:0;min-height:100dvh;height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:100}
.overlay[hidden]{display:none!important}
.question{width:100%;max-width:520px;padding:17px;border-radius:16px;margin:auto;max-height:calc(100dvh - 32px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.question h2{font-size:19px;margin:7px 0 13px}
.options{gap:8px}
.option{padding:11px;font-size:14px}
.record{position:sticky;bottom:0;z-index:2;margin-top:13px;padding:14px 12px;min-height:50px}
.timeline,.status,.panel{margin-left:14px;margin-right:14px}
.panel{padding:15px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><div class="eyebrow">Interactive video learning</div><div class="title">Restaurant English — Customer Conversations</div><p class="sub">Watch the video and answer the questions that appear during the lesson.</p></div><div class="badge" id="progressText">0 / 4 answered</div></header>
  <main>
    <div class="player" id="player">
      <video id="video" preload="metadata" playsinline webkit-playsinline controls controlsList="nodownload" poster="">
        <source src="videoplayback.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
      <div class="start" id="startScreen"><div><button id="startBtn">▶ Start lesson</button><small>Tap to start video</small></div></div>
      <div class="overlay" id="overlay" hidden>
        <section class="question" aria-live="polite">
          <div class="qtag" id="qtag">Checkpoint</div><h2 id="qtext"></h2><div class="options" id="options"></div>
          <button class="primary record" id="recordBtn" disabled>Record answer & continue</button>
        </section>
      </div>
    </div>
    <div class="timeline"><div class="track" id="track"><div class="progress" id="progress"></div></div><div class="time"><span id="current">0:00</span><span id="duration">0:00</span></div></div>
    <div class="status" id="status">Ready to begin.</div>
    <section class="panel results" id="results"><h3>Lesson complete</h3><div class="score" id="score"></div><p id="scoreText"></p><div class="review" id="review"></div><button class="restart" id="restart">↻ Retake lesson</button></section>
  </main>
</div>
<script>
const questions=[
 {t:39,q:"A customer says, “Are you ready to order?” What is the purpose of this question?",o:["To ask whether the customers want to leave","To check whether the customers are ready to choose their food","To ask for payment","To offer a dessert"],a:1,e:"The server is checking whether the customers are ready to place their order."},
 {t:71,q:"Which main course does the customer order?",o:["Grilled fish","Cheeseburger","Chicken hamburger","Vegetable sandwich"],a:0,e:"The customer orders grilled fish as the main course."},
 {t:178,q:"At the counter, what does the customer request to drink?",o:["Orange juice","A bottle of mineral water","Coffee","Coke"],a:1,e:"The customer asks for a bottle of mineral water."},
 {t:256,q:"How often does the customer say she eats this type of food?",o:["Once a month","Every day","About three times a week","Only on weekends"],a:2,e:"She answers, “Pretty often, about three times a week.”"}
];
const video=document.getElementById('video'),overlay=document.getElementById('overlay'),qtext=document.getElementById('qtext'),qtag=document.getElementById('qtag'),options=document.getElementById('options'),recordBtn=document.getElementById('recordBtn'),startScreen=document.getElementById('startScreen'),startBtn=document.getElementById('startBtn'),progress=document.getElementById('progress'),track=document.getElementById('track'),current=document.getElementById('current'),duration=document.getElementById('duration'),status=document.getElementById('status'),progressText=document.getElementById('progressText'),results=document.getElementById('results'),score=document.getElementById('score'),scoreText=document.getElementById('scoreText'),review=document.getElementById('review'),restart=document.getElementById('restart');
let answers=Array(questions.length).fill(null), asked=Array(questions.length).fill(false), active=-1, selected=-1, started=false, finished=false, lastTime=0;
function fmt(s){if(!Number.isFinite(s))return '0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function buildDots(){questions.forEach((q,i)=>{const d=document.createElement('span');d.className='dot';d.style.left=(q.t/288.4615*100)+'%';d.title='Question '+(i+1);d.dataset.i=i;track.appendChild(d)})}buildDots();
function updateUI(){const d=video.duration||288.4615;progress.style.width=Math.min(100,video.currentTime/d*100)+'%';current.textContent=fmt(video.currentTime);duration.textContent=fmt(d);progressText.textContent=answers.filter(x=>x!==null).length+' / '+questions.length+' answered';document.querySelectorAll('.dot').forEach((d,i)=>{d.classList.toggle('done',answers[i]!==null);d.classList.toggle('active',i===active)})}
function showQuestion(i){if(active!==-1||asked[i]||finished)return;active=i;selected=-1;video.pause();qtag.textContent='Checkpoint '+(i+1)+' of '+questions.length;qtext.textContent=questions[i].q;options.innerHTML='';questions[i].o.forEach((label,j)=>{const b=document.createElement('label');b.className='option';b.innerHTML='<input type="radio" name="answer" value="'+j+'"><span>'+label+'</span>';b.addEventListener('click',()=>{selected=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');recordBtn.disabled=false});options.appendChild(b)});overlay.hidden=false;status.textContent='Video paused — select an answer.';updateUI()}
recordBtn.addEventListener('click',async()=>{if(active===-1||selected===-1)return;const i=active;answers[i]=selected;asked[i]=true;active=-1;selected=-1;overlay.hidden=true;status.textContent=answers[i]===questions[i].a?'Answer recorded · correct':'Answer recorded · continuing';updateUI();try{await video.play()}catch(e){startScreen.classList.remove('hidden');status.textContent='Tap Start lesson to resume playback.'}});
startBtn.addEventListener('click',async()=>{startScreen.classList.add('hidden');started=true;try{await video.play();status.textContent='Lesson in progress…'}catch(e){startScreen.classList.remove('hidden');status.textContent='Playback was blocked. Tap Start lesson again.'}});
video.addEventListener('loadedmetadata',updateUI);video.addEventListener('timeupdate',()=>{updateUI();if(!started||finished||active!==-1)return;questions.forEach((q,i)=>{if(!asked[i]&&video.currentTime>=q.t&&lastTime<q.t)showQuestion(i)});lastTime=video.currentTime});
video.addEventListener('play',()=>{startScreen.classList.add('hidden');started=true});video.addEventListener('error',()=>{status.textContent='The video could not be loaded. Check that videoplayback.mp4 is in the same GitHub folder as index.html.'});
video.addEventListener('ended',()=>{if(active!==-1)return;finished=true;video.pause();const correct=answers.reduce((n,a,i)=>n+(a===questions[i].a?1:0),0);score.textContent=Math.round(correct/questions.length*100)+'%';scoreText.textContent=correct+' of '+questions.length+' questions answered correctly.';review.innerHTML='';questions.forEach((q,i)=>{const div=document.createElement('div');div.className='review-item';const ok=answers[i]===q.a;div.innerHTML='<strong>Q'+(i+1)+': '+q.q+'</strong><span class="'+(ok?'correct':'wrong')+'">'+(ok?'Correct':'Incorrect')+'</span><div>'+q.e+'</div>';review.appendChild(div)});results.classList.add('show');status.textContent='Lesson complete.'});
restart.addEventListener('click',()=>{answers.fill(null);asked.fill(false);active=-1;selected=-1;started=false;finished=false;lastTime=0;results.classList.remove('show');video.currentTime=0;startScreen.classList.remove('hidden');overlay.hidden=true;status.textContent='Ready to begin.';updateUI();window.scrollTo({top:0,behavior:'smooth'})});
</script>
</body>
</html>
